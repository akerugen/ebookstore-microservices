spring.application.name=auth-service
server.port=9092

spring.datasource.url=jdbc:postgresql://localhost:9434/auth_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=e7b1324642c76106e9e685101203d88c5694320b41ce3b270f989bc5069757ba
# 1 ???
jwt.access-token-expiration=3600000
# 7 ????
jwt.refresh-token-expiration=604800000

logging.level.root=INFO
logging.level.akerugen.authservice=DEBUG

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# user-feign (feign-client)
user-service.url=http://localhost:9091
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=full