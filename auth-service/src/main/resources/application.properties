spring.application.name=auth-service
server.port=8082

spring.datasource.url=jdbc:postgresql://auth-service-postgres:5432/auth_service_db
# spring.datasource.url=jdbc:postgresql://localhost:9434/auth_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# for BATCH sending (INSERT, UUPDATE)
spring.jpa.properties.hibernate.jdbc.batch_size=20
# for SQL requests grouping (for 1 entity)
spring.jpa.properties.hibernate.order_inserts=true
# grouping all UPDATE for 1 entity
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT
jwt.secret=e7b1324642c76106e9e685101203d88c5694320b41ce3b270f989bc5069757ba
# 1 hour
jwt.access-token-expiration=3600000
# 7 days
jwt.refresh-token-expiration=604800000

# Logging
logging.level.root=INFO
logging.level.akerugen.authservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# user-feign (feign-client)
user-service.url=http://user-service:8081
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=full

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms

spring.cache.type=redis
spring.cache.redis.time-to-live=600000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
