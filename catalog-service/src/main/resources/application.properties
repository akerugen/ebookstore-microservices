spring.application.name=catalog-service
server.port=8083

#spring.datasource.url=jdbc:postgresql://catalog-service-postgres:5432/catalog_service_db
spring.datasource.url=jdbc:postgresql://localhost:9435/catalog_service_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# for BATCH sending (INSERT, UPDATE)
spring.jpa.properties.hibernate.jdbc.batch_size=20
# for SQL requests grouping (for 1 entity)
spring.jpa.properties.hibernate.order_inserts=true
# grouping all UPDATE for 1 entity
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

logging.level.root=INFO
logging.level.com.akerugen.catalogservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

jwt.secret=e7b1324642c76106e9e685101203d88c5694320b41ce3b270f989bc5069757ba

# notification-service (feign-client)
notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8084}

# user-service (feign-client)
user-service.url=${USER_SERVICE_URL:http://user-service:8081}

feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=full