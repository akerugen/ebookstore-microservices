version: '3'

services:
  user-service:
    image: ebookstore-microservices/user-service:0.0.1-SNAPSHOT
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://user-service-postgres:5432/user_service_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
    depends_on:
      user-service-postgres:
        condition: service_healthy
    networks:
      - ebookstore-microservices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  user-service-postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=user_service_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - user_service_postgres_data:/var/lib/postgresql/data
    networks:
      - ebookstore-microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ebookstore-microservices:
    driver: bridge

volumes:
  user_service_postgres_data:
