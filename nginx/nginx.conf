events {
    # Сколько одновременных соединений может обработать Nginx
    worker_connections 1024;
}

http {
    # upstream: определение сервисов
    upstream auth-service {
         # адрес в Docker сети: имя_контейнера:порт
         server auth-service:8082;
     }

    upstream user-service {
        server user-service:8081;
    }

    upstream catalog-service {
        server catalog-service:8083;
    }

    # логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" roles=$role_name method=$request_method uri=$request_uri';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Map для извлечения роли из ответа auth-validate
    # Заголовок: X-User-Roles: ROLE_SUPERUSER,ROLE_ADMIN
    map $http_x_user_roles $role_name {
        default "ANONYMOUS";
        ~*ROLE_SUPERUSER "SUPERUSER";
        ~*ROLE_ADMIN "ADMIN";
        ~*ROLE_USER "USER";
    }

    # основной сервер
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # CORS = разрешаем запросы с браузера
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # маршрут: /api/auth/* (без проверки токена)
        # все запросы доступны всем
        location /api/auth/ {
            proxy_pass http://auth-service/api/auth/;

            # передача заголовков
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # сколько ждем ответа
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # маршрут: /api/users/* (без проверки токена)
        # все запросы требуют авторизации
        location /api/users/ {
            auth_request /auth-validate;
            auth_request_set $user_roles $upstream_http_x_user_roles;

            proxy_pass http://user-service/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Roles $user_roles;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # маршрут: /api/catalog/* (с RBAC: GET для всех, POST/PUT/DELETE только для ADMIN)
        location /api/catalog/ {
            auth_request /auth-validate;
            auth_request_set $user_roles $upstream_http_x_user_roles;

            # Проверяем метод и роли
            # GET/HEAD/OPTIONS - разрешить для всех авторизованных (USER, ADMIN, SUPERUSER)
            # POST/PUT/DELETE - разрешить только для ADMIN, SUPERUSER
            if ($request_method = POST) {
                if ($http_x_user_roles !~ "ROLE_ADMIN|ROLE_SUPERUSER") {
                    return 403 "Forbidden: Admin role required for POST requests\n";
                }
            }
            if ($request_method = PUT) {
                if ($http_x_user_roles !~ "ROLE_ADMIN|ROLE_SUPERUSER") {
                    return 403 "Forbidden: Admin role required for PUT requests\n";
                }
            }
            if ($request_method = DELETE) {
                if ($http_x_user_roles !~ "ROLE_ADMIN|ROLE_SUPERUSER") {
                    return 403 "Forbidden: Admin role required for DELETE requests\n";
                }
            }

            proxy_pass http://catalog-service/api/catalog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Roles $user_roles;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # внутренний маршрут: /auth-validate
        # маршрут НЕ доступен снаружи, используется только для проверки токена
        location = /auth-validate {
            internal;

            proxy_pass http://auth-service/api/auth/validate-header;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            proxy_method GET;

            set $token "";
            if ($http_authorization ~* "^Bearer (.+)$") {
                set $token $1;
            }
            proxy_set_body "{\"token\":\"$token\"}";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # health-check
        location /health {
            access_log off;
            return 200 "Nginx Gateway OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "E-Book Store API Gateway\n";
            add_header Content-Type text/plain;
        }
    }
}
