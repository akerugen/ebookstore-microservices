events {
    # сколько одновременных соединений может обработать Nginx
    worker_connections 1024;
}

http {
    # upstream: определение сервисов
    upstream auth-service {
    # адрес в Docker сети: имя_контейнера:порт
        server auth-service:8082;
    }

    upstream user-service {
        server user-service:8081;
    }

    upstream catalog-service {
        server catalog-service:8083;
    }

# логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" method=$request_method uri=$request_uri';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # основной сервер
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # CORS = разрешаем запросы с браузера
        # прячем заголовки CORS от backend, чтобы не было дублей вида "http://..., *"
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;

        # разрешаем только origin фронтенда (конфигурируемый через переменную окружения)
        # по умолчанию для dev окружения, в production заменяется через envsubst
        add_header 'Access-Control-Allow-Origin' '$CORS_ORIGIN' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Max-Age' 1728000;

        # маршрут: /api/auth/* (без проверки токена)
        # все запросы доступны всем
        location /api/auth/ {
            # preflight (OPTIONS) обрабатываем сразу
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://auth-service/api/auth/;

            # передача заголовков
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # передаем Authorization заголовок для endpoints, которые требуют проверки роли
            proxy_set_header Authorization $http_authorization;

            # сколько ждем ответа
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # маршрут: /api/users/* (все запросы требуют авторизации)
        # Обрабатываем как с trailing slash, так и без него для консистентности
        location /api/users {
            # preflight (OPTIONS) не должен ходить в auth-service, иначе CORS ломается
            if ($request_method = OPTIONS) {
                return 204;
            }

            auth_request /auth-validate;

            # Используем proxy_pass без пути, чтобы весь URI передавался как есть
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # маршрут: /api/catalog/* (с RBAC: GET для всех, POST/PUT/DELETE только для ADMIN)
        location /api/catalog/ {
            # preflight (OPTIONS) не должен ходить в auth-service, иначе CORS ломается
            if ($request_method = OPTIONS) {
                return 204;
            }

            auth_request /auth-validate;

            proxy_pass http://catalog-service/api/catalog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Внутренний маршрут для валидации токена
        # auth_request вызывает это, ожидает 200 (OK) или 401 (Unauthorized)
        location = /auth-validate {
            internal;

            # делаём GET запрос к auth-service для проверки валидности токена
            proxy_pass http://auth-service/api/auth/validate-header;

            # передаём все заголовки из оригинального запроса
            proxy_pass_request_headers on;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Не передаём body
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Content-Type "";
        }

        # Health checks
        location /health {
            access_log off;
            return 200 "Nginx Gateway OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "E-Book Store API Gateway\n";
            add_header Content-Type text/plain;
        }
    }
}
