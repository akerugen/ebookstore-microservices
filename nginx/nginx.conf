events {
    # Сколько одновременных соединений может обработать Nginx
    worker_connections 1024;
}

http {
    # upstream: определение сервисов
    upstream auth-service {
         # адрес в Docker сети: имя_контейнера:порт
         server auth-service:8082;
     }

    upstream user-service {
        server user-service:8081;
    }

    upstream catalog-service {
        server catalog-service:8083;
    }

    # логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" roles=$user_roles method=$request_method uri=$request_uri';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Map для проверки прав доступа
    # Возвращает пустую строку если доступ разрешен, или сообщение об ошибке если запрещен
    map $request_method:$upstream_http_x_user_roles $catalog_access {
        default "allowed";

        # POST разрешен только для ADMIN и SUPER_USER
        ~^POST:(.*ADMIN.*|.*SUPER_USER.*)$ "allowed";
        ~^POST: "forbidden";

        # PUT разрешен только для ADMIN и SUPER_USER
        ~^PUT:(.*ADMIN.*|.*SUPER_USER.*)$ "allowed";
        ~^PUT: "forbidden";

        # DELETE разрешен только для ADMIN и SUPER_USER
        ~^DELETE:(.*ADMIN.*|.*SUPER_USER.*)$ "allowed";
        ~^DELETE: "forbidden";

        # GET разрешен для всех
        ~^GET: "allowed";
        ~^HEAD: "allowed";
        ~^OPTIONS: "allowed";
    }

    # основной сервер
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # CORS = разрешаем запросы с браузера
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # маршрут: /api/auth/* (без проверки токена)
        # все запросы доступны всем
        location /api/auth/ {
            proxy_pass http://auth-service/api/auth/;

            # передача заголовков
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # сколько ждем ответа
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # маршрут: /api/users/* (без проверки токена)
        # все запросы требуют авторизации
        location /api/users/ {
            auth_request /auth-validate;
            auth_request_set $user_roles $upstream_http_x_user_roles;

            proxy_pass http://user-service/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Roles $user_roles;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # маршрут: /api/catalog/* (с RBAC: GET для всех, POST/PUT/DELETE только для ADMIN)
        location /api/catalog/ {
            auth_request /auth-validate;
            auth_request_set $user_roles $upstream_http_x_user_roles;

            # Проверяем метод и роли
            # GET/HEAD/OPTIONS - разрешить для всех авторизованных (USER, ADMIN, SUPERUSER)
            # POST/PUT/DELETE - разрешить только для ADMIN, SUPERUSER
            set $access_key "$request_method:$user_roles";

            if ($catalog_access = "forbidden") {
                return 403 "Forbidden: Admin role (ADMIN or SUPER_USER) required for $request_method requests\n";
            }

            proxy_pass http://catalog-service/api/catalog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User-Roles $user_roles;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # внутренний маршрут: /auth-validate
        # маршрут НЕ доступен снаружи, используется только для проверки токена
        location = /auth-validate {
            internal;

            proxy_pass http://auth-service/api/auth/validate-header;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";
            proxy_method GET;

            set $token "";
            if ($http_authorization ~* "^Bearer (.+)$") {
                set $token $1;
            }
            proxy_set_body "{\"token\":\"$token\"}";
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Health checks
        location /health {
            access_log off;
            return 200 "Nginx Gateway OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "E-Book Store API Gateway\n";
            add_header Content-Type text/plain;
        }
    }
}
