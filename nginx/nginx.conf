events {
    # Сколько одновременных соединений может обработать Nginx
    worker_connections 1024;
}

http {
    # upstream: определение сервисов
    upstream auth-service {
         # адрес в Docker сети: имя_контейнера:порт
         server auth-service:8082;
     }

    upstream user-service {
        server user-service:8081;
    }

    # логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # основной сервер
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # CORS = разрешаем запросы с браузера
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # маршрут: /api/auth/* (без проверки токена)
        # все запросы доступны всем
        location /api/auth/ {
                proxy_pass http://auth-service/api/auth/;

                # передача заголовков
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                # сколько ждем ответа
                proxy_connect_timeout 60s;
                proxy_read_timeout 60s;
        }

        # маршрут: /api/users/* (без проверки токена)
        # все запросы требуют авторизации
        location /api/users/ {
            # проверка токена
            auth_request /auth-validate;

            proxy_pass http://user-service/api/users/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # внутренний маршрут: /auth-validate
        # маршрут НЕ доступен снаружи, используется только для проверки токена
        location = /auth-validate {
            internal;

            proxy_pass http://auth-service/api/auth/validate-header;

            # передача токена из заголовка Authorization
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type "application/json";

            proxy_method GET;

            # передача токена в теле запроса
            # формат: {"token":"Bearer eyJ..."}
            set $token "";
            if ($http_authorization ~* "^Bearer (.+)$") {
                set $token $1;
            }
            proxy_set_body "{\"token\":\"$token\"}";

            # не передаваем оригинальное тело запроса
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # health-check
        location /health {
            access_log off;
            return 200 "Nginx Gateway OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "E-Book Store API Gateway\n";
            add_header Content-Type text/plain;
        }
    }
}